# Publish the documentation website to GitHub Pages from the repository default
# branch. Pull requests still build the production site through `check:ci:static`.
name: Deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  # Projected source links target the public repository, whose history can
  # differ from this workflow's source repository. This stays on main rather
  # than following the dispatched tag, so projected source links resolve on the
  # public repository's default branch.
  DOCS_REPOSITORY_REF: main
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  HYDRA_TELEMETRY_DISABLED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      # The generated documentation reads vendored sources from the submodules.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: true
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Verify and build documentation
        env:
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}/
        run: pnpm run doc-sync

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/.dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
