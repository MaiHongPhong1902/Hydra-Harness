# Keyless replay counterpart to browser.cordis.yml. The seam, its NDJSON
# framing, the tools, the cap and the rendering all stay real; only the Electron
# process is scripted (a real window needs a 200 MB binary and a display, and
# reports host-dependent viewport metrics) and the model adapter is replay.
- id: base
  name: '@hydra/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@hydra/harness-llm-deepseek'
        disabled: true
      - insert:
          - id: browser-electron
            name: '@hydra/harness-browser-electron'
            config:
              show: false
              browserPermissions:
                browsing: allow
                downloads: allow
                uploads: allow
              # Never spawned: the scripted child replaces the spawn itself,
              # and this only keeps the launcher from resolving a real binary.
              electronPath: /snapshot/electron
          - id: browser-snapshot-backend
            name: './browser-snapshot-backend.mjs'
          - id: tool-browser
            name: '@hydra/harness-tool-browser'
          - id: llm-replay
            name: '@hydra/harness-llm-replay'
            config:
              providers:
                - id: deepseek-official
                  name: DeepSeek
                  models:
                    - id: deepseek-v4-flash
                    - id: deepseek-v4-pro
