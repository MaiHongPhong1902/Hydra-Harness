# Embedded-browser composition for the browser snapshot scenario: the seam that
# owns the Electron window and the model-facing `browser_*` tools.
- id: base
  name: '@hydraharness/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: browser-electron
            name: '@hydraharness/harness-browser-electron'
            config:
              show: false
          - id: tool-browser
            name: '@hydraharness/harness-tool-browser'
