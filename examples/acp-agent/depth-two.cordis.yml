# Depth-limit snapshot overlay: keep the default composition and allow two
# generations of spawn children before runtime enforcement rejects another.
- id: base
  name: '@bosch/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: tool-subagent
        name: '@bosch/bh-tool-subagent'
        config:
          provider: spawn
          toolName: subagent
          backgroundMode: continuable
          maxDepth: 2
