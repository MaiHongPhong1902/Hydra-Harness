# Filesystem-scenario overlay: the sandboxed filesystem stack already lives in
# the base cordis.yml, so this overlay adds only the local tool-result spill
# storage those scenarios exercise.
- id: base
  name: '@hydra/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: spill-local
            name: '@hydra/harness-spill-local'
            config:
              root: !!js process.env.BH_SNAPSHOT_SPILL_ROOT ?? './.spill'
          - id: spill-policy
            name: '@hydra/harness-spill-policy'
            config:
              maxInlineBytes: !!js process.env.BH_SNAPSHOT && 800 || 50000
