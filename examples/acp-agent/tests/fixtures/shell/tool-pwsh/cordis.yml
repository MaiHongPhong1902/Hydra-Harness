# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@bosch/bh-system-prompt'

- id: tools
  name: '@bosch/bh-tools'

- id: subprocess
  name: '@bosch/bh-subprocess-local'

- id: bash
  name: '@bosch/bh-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@bosch/bh-shell-env'

- id: tasks
  name: '@bosch/bh-jobs-local'

- id: tool-jobs
  name: '@bosch/bh-tool-jobs'

- id: tool-pwsh
  name: '@bosch/bh-tool-pwsh'
