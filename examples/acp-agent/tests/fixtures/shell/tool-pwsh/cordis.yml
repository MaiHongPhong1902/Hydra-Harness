# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@hydraharness/harness-system-prompt'

- id: tools
  name: '@hydraharness/harness-tools'

- id: subprocess
  name: '@hydraharness/harness-subprocess-local'

- id: bash
  name: '@hydraharness/harness-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@hydraharness/harness-shell-env'

- id: tasks
  name: '@hydraharness/harness-jobs-local'

- id: tool-jobs
  name: '@hydraharness/harness-tool-jobs'

- id: tool-pwsh
  name: '@hydraharness/harness-tool-pwsh'
