# Keyless replay counterpart to persistent-pwsh.cordis.yml.
- id: llm-replay
  name: '@hydra1902/harness-llm-replay'
  config:
    providers:
      - id: deepseek-official
        name: DeepSeek
        models:
          - id: deepseek-v4-pro

- id: terminal
  name: '@hydra1902/harness-terminal'

- id: sandbox-policy
  name: '@hydra1902/harness-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@hydra1902/harness-subprocess-local'

- id: terminal-pwsh
  name: '@hydra1902/harness-terminal-bash'
  config:
    shellDialect: pwsh
    timeoutMs: 30000

- id: acp-agent
  name: '@hydra1902/harness-acp-demo'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro
    persistenceRoot: !!js process.env.HYDRA_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: none
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: tool-pwsh-persistent
  name: '@hydra1902/harness-tool-pwsh-persistent'
