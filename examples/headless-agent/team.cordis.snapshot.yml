# Keyless Agent Teams composition over the real headless app and deterministic fixture adapter.
- id: base
  name: '@bosch/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@bosch/bh-llm-deepseek'
        disabled: true
      - id: tool-subagent-control
        name: '@bosch/bh-tool-subagent-control'
        disabled: true
      - id: tool-subagent-report
        name: '@bosch/bh-tool-subagent-report'
        disabled: true
      - id: tool-subagent
        name: '@bosch/bh-tool-subagent'
        config:
          provider: spawn
          toolName: subagent
          backgroundMode: one-shot
          maxDepth: 1
      - id: tool-subagent-fork
        name: '@bosch/bh-tool-subagent'
        config:
          provider: fork
          toolName: subagent_fork
          backgroundMode: one-shot
          maxDepth: 1
      - insert:
          - id: agent-team
            name: '@bosch/bh-experimental-agent-team'
          - id: tool-agent-team
            name: '@bosch/bh-experimental-tool-agent-team'
          - id: team-fixture-llm
            name: './tests/fixtures/team-llm.mjs'
