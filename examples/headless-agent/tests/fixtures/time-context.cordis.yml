# Test-only composition: keep time-context opt-in while exercising its real Loader/app path.
- id: time-context-mock-llm
  name: './time-context-mock-llm.ts'

# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@hydraharness/harness-subprocess-local'

- id: bash
  name: '@hydraharness/harness-bash-local'

- id: time-context
  name: '@hydraharness/harness-time-context'

- id: agent-spine
  name: '@hydraharness/harness-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: time-context-mock
        model: time-context-mock
        cwd: !!js process.cwd()
    persona: 'Test the time-context plugin.'
    workspaceContext: false

- id: persistence
  name: '@hydraharness/harness-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: 'none'

- id: checkpoint-policy
  name: '@hydraharness/harness-session-checkpoint-policy'
