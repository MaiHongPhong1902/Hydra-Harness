<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bosch Harness browser chrome</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #f1f3f4; color: #202124; font: 13px system-ui, sans-serif; overflow: hidden; }
      .tabs { height: 34px; display: flex; align-items: end; gap: 4px; padding: 0 10px; background: #dee1e6; }
      #tabs { min-width: 0; flex: 1; display: flex; align-items: end; gap: 4px; overflow: hidden; }
      .tab { min-width: 0; width: min(240px, 40vw); height: 30px; display: flex; align-items: center; border-radius: 10px 10px 0 0; background: #cfd2d6; }
      .tab[aria-selected="true"] { background: #fff; }
      .tab-select { min-width: 0; flex: 1; height: 100%; padding: 7px 4px 7px 12px; overflow: hidden; border: 0; background: transparent; color: inherit; text-align: left; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
      .tab-close, #new-tab { width: 26px; height: 26px; flex: 0 0 26px; margin: 2px; border: 0; border-radius: 50%; background: transparent; color: inherit; font-size: 18px; cursor: pointer; }
      .tab-close:hover, #new-tab:hover { background: #dfe3e7; }
      .controls { height: 40px; display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
      .controls button { width: 28px; height: 28px; border: 0; border-radius: 50%; background: transparent; color: inherit; font-size: 18px; cursor: pointer; }
      .controls button:disabled { color: #9aa0a6; cursor: default; }
      .controls button:not(:disabled):hover { background: #dfe3e7; }
      form { flex: 1; }
      input { width: 100%; height: 28px; border: 1px solid #c4c7c5; border-radius: 14px; padding: 0 12px; outline: none; font: inherit; }
      input:focus { border-color: #1a73e8; box-shadow: 0 0 0 1px #1a73e8; }
    </style>
  </head>
  <body>
    <div class="tabs"><div id="tabs" role="tablist"></div><button id="new-tab" type="button" aria-label="New tab" title="New tab">+</button></div>
    <div class="controls">
      <button id="back" type="button" aria-label="Back" title="Back">←</button>
      <button id="forward" type="button" aria-label="Forward" title="Forward">→</button>
      <button id="reload" type="button" aria-label="Reload" title="Reload">↻</button>
      <form id="omnibox-form"><input id="omnibox" aria-label="Search or enter address" autocomplete="off" placeholder="Search or enter address" spellcheck="false" /></form>
    </div>
  </body>
</html>
