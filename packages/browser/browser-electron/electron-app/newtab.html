<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Tab</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg-color: #ffffff;
        --text-color: #202124;
        --subtext-color: #5f6368;
        --card-bg: #f1f3f4;
        --card-hover: #e8eaed;
        --input-bg: #ffffff;
        --input-border: #dfe1e5;
        --input-shadow: rgba(32, 33, 36, 0.12);
        --accent-color: #1a73e8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #202124;
          --text-color: #e8eaed;
          --subtext-color: #9aa0a6;
          --card-bg: #303134;
          --card-hover: #3c4043;
          --input-bg: #303134;
          --input-border: #5f6368;
          --input-shadow: rgba(0, 0, 0, 0.3);
          --accent-color: #8ab4f8;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        padding: 24px 16px;
      }
      .logo-container {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
      }
      .logo-text {
        font-size: 40px;
        font-weight: 600;
        letter-spacing: -0.5px;
      }
      .search-form {
        width: 100%;
        max-width: 600px;
        margin-bottom: 36px;
      }
      .search-box {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 48px;
        padding: 0 16px;
        background-color: var(--input-bg);
        border: 1px solid var(--input-border);
        border-radius: 24px;
        box-shadow: 0 1px 6px var(--input-shadow);
        transition: box-shadow 0.2s ease, border-color 0.2s ease;
      }
      .search-box:focus-within {
        border-color: var(--accent-color);
        box-shadow: 0 2px 8px var(--input-shadow);
      }
      .search-icon {
        width: 18px;
        height: 18px;
        color: var(--subtext-color);
        flex-shrink: 0;
      }
      .search-input {
        flex: 1;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text-color);
        font-size: 16px;
      }
      .shortcuts-grid {
        display: grid;
        grid-template-columns: repeat(4, 96px);
        gap: 16px;
        justify-content: center;
      }
      @media (max-width: 480px) {
        .shortcuts-grid { grid-template-columns: repeat(2, 96px); }
      }
      .shortcut {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-decoration: none;
        color: var(--text-color);
        padding: 12px 6px;
        border-radius: 12px;
        transition: background-color 0.15s ease;
      }
      .shortcut:hover {
        background-color: var(--card-hover);
      }
      .shortcut-icon-wrapper {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background-color: var(--card-bg);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 8px;
        font-size: 20px;
      }
      .shortcut-label {
        font-size: 12px;
        text-align: center;
        max-width: 80px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <div class="logo-container">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <circle cx="12" cy="12" r="4"></circle>
        <line x1="21.17" y1="8" x2="12" y2="8"></line>
        <line x1="3.95" y1="6.06" x2="8.54" y2="14"></line>
        <line x1="10.88" y1="21.94" x2="15.46" y2="14"></line>
      </svg>
      <div class="logo-text">Browser</div>
    </div>

    <form class="search-form" id="search-form">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input class="search-input" id="search-input" placeholder="Search Google or type a URL" autofocus autocomplete="off" spellcheck="false" />
      </div>
    </form>

    <div class="shortcuts-grid">
      <a class="shortcut" href="https://www.google.com">
        <div class="shortcut-icon-wrapper">🔍</div>
        <span class="shortcut-label">Google</span>
      </a>
      <a class="shortcut" href="https://github.com">
        <div class="shortcut-icon-wrapper">🐙</div>
        <span class="shortcut-label">GitHub</span>
      </a>
      <a class="shortcut" href="https://stackoverflow.com">
        <div class="shortcut-icon-wrapper">📚</div>
        <span class="shortcut-label">StackOverflow</span>
      </a>
      <a class="shortcut" href="https://wikipedia.org">
        <div class="shortcut-icon-wrapper">📖</div>
        <span class="shortcut-label">Wikipedia</span>
      </a>
      <a class="shortcut" href="https://youtube.com">
        <div class="shortcut-icon-wrapper">▶️</div>
        <span class="shortcut-label">YouTube</span>
      </a>
      <a class="shortcut" href="https://reddit.com">
        <div class="shortcut-icon-wrapper">🤖</div>
        <span class="shortcut-label">Reddit</span>
      </a>
      <a class="shortcut" href="https://news.ycombinator.com">
        <div class="shortcut-icon-wrapper">📰</div>
        <span class="shortcut-label">Hacker News</span>
      </a>
      <a class="shortcut" href="https://developer.mozilla.org">
        <div class="shortcut-icon-wrapper">🌐</div>
        <span class="shortcut-label">MDN</span>
      </a>
    </div>

    <script>
      document.getElementById('search-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const query = document.getElementById('search-input').value.trim();
        if (!query) return;
        if (/^(https?:\/\/|[a-z0-9-]+\.[a-z0-9.-]+)/i.test(query)) {
          const url = query.startsWith('http://') || query.startsWith('https://') ? query : 'https://' + query;
          window.location.href = url;
        } else {
          window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(query);
        }
      });
    </script>
  </body>
</html>
