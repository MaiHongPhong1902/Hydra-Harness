<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autofill fixture</title>
    <style>
      :root {
        --bg-primary: #0f172a;
        --bg-secondary: #1e293b;
        --bg-tertiary: #334155;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --accent-sky: #38bdf8;
        --accent-indigo: #818cf8;
        --accent-emerald: #34d399;
        --border-color: #334155;
        --radius: 12px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        background: rgba(30, 41, 59, 0.85);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border-color);
        padding: 14px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand-badge {
        background: linear-gradient(135deg, var(--accent-sky), var(--accent-indigo));
        color: #0f172a;
        font-weight: 800;
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 9999px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .brand-title { font-size: 15px; font-weight: 700; }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 36px 20px;
      }
      .card-container {
        width: 100%;
        max-width: 520px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .card {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      }
      .card-title {
        font-size: 14px;
        font-weight: 700;
        color: var(--accent-sky);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
      }
      input {
        width: 100%;
        padding: 10px 14px;
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        color: var(--text-primary);
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      input:focus {
        border-color: var(--accent-sky);
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="brand-badge">Hydra</span>
        <span class="brand-title">Autofill Vault Fixture</span>
      </div>
    </header>
    <main>
      <div class="card-container">
        <div class="card">
          <div class="card-title">🔐 Account Credentials</div>
          <form>
            <div class="field">
              <label for="username">Username / Email</label>
              <input id="username" autocomplete="username" placeholder="name@example.com" />
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input id="password" type="password" autocomplete="current-password" value="markup-password-secret" />
            </div>
          </form>
        </div>

        <div class="card">
          <div class="card-title">👤 Contact Information</div>
          <form>
            <div class="field">
              <label for="contact-name">Full Name</label>
              <input id="contact-name" autocomplete="name" placeholder="Full name" />
            </div>
            <div class="field">
              <label for="implicit-city">City</label>
              <input id="implicit-city" name="city" placeholder="City" />
            </div>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
