<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Next page</title>
    <style>
      :root {
        --bg-primary: #0f172a;
        --bg-secondary: #1e293b;
        --bg-tertiary: #334155;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --accent-sky: #38bdf8;
        --accent-indigo: #818cf8;
        --accent-emerald: #34d399;
        --border-color: #334155;
        --radius: 12px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        background: rgba(30, 41, 59, 0.85);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border-color);
        padding: 14px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand-badge {
        background: linear-gradient(135deg, var(--accent-sky), var(--accent-indigo));
        color: #0f172a;
        font-weight: 800;
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 9999px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .brand-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--text-primary);
      }
      .status-pill {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid var(--border-color);
        padding: 5px 12px;
        border-radius: 9999px;
        font-size: 12px;
        color: var(--accent-emerald);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: var(--accent-emerald);
        box-shadow: 0 0 8px var(--accent-emerald);
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 36px 20px;
      }
      .card {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 36px 32px;
        width: 100%;
        max-width: 460px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        position: relative;
        overflow: hidden;
        text-align: center;
      }
      .card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--accent-emerald), var(--accent-sky));
      }
      .success-icon-wrap {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: rgba(52, 211, 153, 0.15);
        border: 1px solid rgba(52, 211, 153, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        color: var(--accent-emerald);
        font-size: 30px;
      }
      .card-tag {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--accent-emerald);
        margin-bottom: 6px;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        color: var(--text-primary);
        letter-spacing: -0.02em;
        margin-bottom: 6px;
      }
      .card-subtitle {
        font-size: 13px;
        color: var(--text-muted);
        margin-bottom: 24px;
      }
      .signed-in-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 20px;
        background: rgba(52, 211, 153, 0.12);
        border: 1px solid rgba(52, 211, 153, 0.3);
        border-radius: 10px;
        color: var(--accent-emerald);
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 24px;
      }
      .meta-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 28px;
        text-align: left;
      }
      .meta-item {
        background: rgba(15, 23, 42, 0.5);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 10px 12px;
      }
      .meta-label {
        font-size: 11px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 2px;
      }
      .meta-value {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-secondary);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      .btn-return {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 10px 18px;
        background: var(--bg-tertiary);
        color: var(--text-primary);
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        transition: all 0.2s ease;
      }
      .btn-return:hover {
        background: rgba(56, 189, 248, 0.15);
        border-color: rgba(56, 189, 248, 0.4);
        color: var(--accent-sky);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="brand-badge">Hydra</span>
        <span class="brand-title">Browser Automation Fixture</span>
      </div>
      <div class="status-pill">
        <span class="status-dot"></span>
        <span>CONNECTED</span>
      </div>
    </header>
    <main>
      <div class="card">
        <div class="success-icon-wrap">✓</div>
        <span class="card-tag">Target Destination</span>
        <h1>Navigation Succeeded</h1>
        <p class="card-subtitle">User-initiated and agent navigation successfully resolved.</p>
        <div class="signed-in-badge">
          <span>Signed in</span>
        </div>
        <div class="meta-grid">
          <div class="meta-item">
            <div class="meta-label">Route</div>
            <div class="meta-value">/next.html</div>
          </div>
          <div class="meta-item">
            <div class="meta-label">HTTP Status</div>
            <div class="meta-value">200 OK</div>
          </div>
        </div>
        <a href="form.html" class="btn-return">Return to Form</a>
      </div>
    </main>
  </body>
</html>
