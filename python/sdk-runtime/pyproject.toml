[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "hydra-harness-runtime-bin"
version = "0.0.0.dev0"
description = "Pinned Hydra harness runtime for the Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DeepSeek" }]

[project.urls]
Homepage = "https://github.com/MaiHongPhong1902/Hydra-Harness"
Documentation = "https://github.com/MaiHongPhong1902/Hydra-Harness/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/MaiHongPhong1902/Hydra-Harness/issues"
Source = "https://github.com/MaiHongPhong1902/Hydra-Harness"

# Include the injected executable and default config; exclude the dev-only node
# closure from wheels and sdists.
[tool.hatch.build]
artifacts = ["src/hydra_harness_runtime/runtime/hydra-jsonrpc-agent-*"]
exclude = ["src/hydra_harness_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/hydra_harness_runtime"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
